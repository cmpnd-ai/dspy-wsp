name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          # This package needs DSPy 3.5. Remove this line once 3.5 is on PyPI and pyproject.toml pins it.
          # DSPy main still reports the 3.4.1 version number, so pip must be forced to replace the PyPI build.
          pip install --force-reinstall --no-deps "dspy @ git+https://github.com/stanfordnlp/dspy@main"
      - run: ruff check .
      - run: pytest -q
