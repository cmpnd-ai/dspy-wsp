[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dspy-wsp"
version = "0.1.0"
description = "Weight-space programming as a DSPy optimizer: a frontier LM reads and edits a small model's weights, with no gradients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Drew Breunig", email = "dbreunig@gmail.com" }]
keywords = ["dspy", "llm", "optimizer", "interpretability", "weight editing"]
dependencies = [
    "dspy>=3.4,<3.5",
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.2",
]

[project.optional-dependencies]
hf = ["transformers>=4.45", "huggingface_hub>=0.24"]
mlx = ["mlx-lm>=0.32", "huggingface_hub>=0.24"]
vllm = ["vllm>=0.32", "transformers>=4.45", "huggingface_hub>=0.24"]
decision = ["dspy[typesafe]>=3.4,<3.5", "typesafe-sdk==0.7.5", "tokenizers>=0.20", "huggingface_hub>=0.24", "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'"]
examples = ["transformers>=4.45", "huggingface_hub>=0.24", "datasets>=2.14", "math-verify>=0.7"]
dev = ["pytest>=8", "transformers>=4.45", "huggingface_hub>=0.24", "typesafe-sdk==0.7.5", "requests>=2.31", "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
dspy-wsp = "dspy_wsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
