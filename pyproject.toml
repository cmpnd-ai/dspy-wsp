[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dspy-wsp"
version = "0.1.1"
description = "Weight-space programming as a DSPy optimizer: a frontier LM reads and edits a small model's weights, with no gradients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Drew Breunig", email = "dbreunig@gmail.com" }]
keywords = ["dspy", "llm", "optimizer", "interpretability", "weight editing"]
dependencies = [
    "dspy[typesafe]>=3.4,<3.5",
    "gepa>=0.1.4",
    "numpy>=1.26",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
    "torch>=2.2",
    "transformers>=4.45",
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/cmpnd-ai/dspy-wsp"
Issues = "https://github.com/cmpnd-ai/dspy-wsp/issues"

[project.optional-dependencies]
vllm = ["vllm>=0.32"]
examples = ["datasets>=2.14", "math-verify>=0.7"]
dev = ["pytest>=8", "requests>=2.31", "ruff>=0.11"]

[project.scripts]
dspy-wsp = "dspy_wsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 200
target-version = "py310"
extend-exclude = ["examples/runs", "results"]

[tool.ruff.lint]
# Named rules, so every ruff version checks the same set.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Choice["stop", "continue"] subscripts read as forward annotations.
"tests/*" = ["F722", "F821"]
